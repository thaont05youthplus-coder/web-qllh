  <ellipse cx="286" cy="218" rx="9" ry="10.5" fill="#1F2430"/>
  <circle cx="229" cy="214" r="3" fill="#FFFFFF"/>
  <circle cx="289" cy="214" r="3" fill="#FFFFFF"/>

