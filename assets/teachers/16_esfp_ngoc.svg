  </defs>
  <rect width="512" height="512" fill="url(#bg16)"/>

  <!-- Hair back -->
  <path d="M166 184 C150 245, 152 325, 178 358 L334 358 C360 325, 362 245, 346 184 C328 112, 184 112, 166 184 Z" fill="#1F2430"/>

