      <stop offset="0%" stop-color="#FDF9EB"/>
      <stop offset="100%" stop-color="#F9F0D0"/>
    </linearGradient>
    <linearGradient id="blouse14" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2D77E"/>
      <stop offset="100%" stop-color="#DFB84B"/>
