  <path d="M164 176 C140 245, 136 360, 152 430 C178 442, 206 420, 212 372 L300 372 C306 420, 334 442, 360 430 C376 360, 372 245, 348 176 C332 108, 180 108, 164 176 Z" fill="#1E222E"/>

