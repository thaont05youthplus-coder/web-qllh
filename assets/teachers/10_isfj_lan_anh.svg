<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF7F9"/>
      <stop offset="100%" stop-color="#E1F0F3"/>
    </linearGradient>
    <linearGradient id="cardigan10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6BB5C0"/>
      <stop offset="100%" stop-color="#4A8E9A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg10)"/>

  <!-- Back hair (shoulder-length) -->
  <path d="M168 188 C154 245, 160 315, 184 345 L328 345 C352 315, 358 245, 344 188 C332 122, 180 122, 168 188 Z" fill="#1F2430"/>

  <!-- Shoulders & Light Teal Cardigan -->
  <path d="M108 512 C112 396, 164 352, 220 342 L292 342 C348 352, 400 396, 404 512 Z" fill="url(#cardigan10)" stroke="#2E646E" stroke-width="4"/>
  <!-- Inner white blouse -->
  <path d="M214 340 L256 446 L298 340 Z" fill="#FFFFFF" stroke="#DCE6EA" stroke-width="3"/>
  <!-- Cardigan lapel trim -->
  <path d="M214 340 L256 452 L298 340" fill="none" stroke="#3C7C87" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="256" cy="468" r="5" fill="#E8F4F6"/>
  <circle cx="256" cy="494" r="5" fill="#E8F4F6"/>

  <!-- Neck & Soft Shadow -->
  <rect x="228" y="294" width="56" height="62" rx="20" fill="#F2BA93"/>
  <path d="M228 308 Q256 326 284 308 L284 298 L228 298 Z" fill="#E0A178" opacity="0.55"/>

  <!-- Ears -->
  <ellipse cx="184" cy="236" rx="13" ry="20" fill="#F2BA93" stroke="#C98A63" stroke-width="3"/>
  <ellipse cx="328" cy="236" rx="13" ry="20" fill="#F2BA93" stroke="#C98A63" stroke-width="3"/>

  <!-- Face -->
  <path d="M186 210 C186 146, 326 146, 326 210 C326 276, 294 316, 256 316 C218 316, 186 276, 186 210 Z" fill="#FAC7A2" stroke="#C98A63" stroke-width="3.5"/>
  <!-- Soft blush -->
  <ellipse cx="214" cy="254" rx="16" ry="9" fill="#F28C7D" opacity="0.28"/>
  <ellipse cx="298" cy="254" rx="16" ry="9" fill="#F28C7D" opacity="0.28"/>

  <!-- Eyes & Gentle Eyebrows -->
  <path d="M208 205 Q224 196 240 203" fill="none" stroke="#232833" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M272 203 Q288 196 304 205" fill="none" stroke="#232833" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="225" cy="224" rx="9.5" ry="10.5" fill="#1F2430"/>
  <ellipse cx="287" cy="224" rx="9.5" ry="10.5" fill="#1F2430"/>
  <circle cx="228" cy="220" r="3" fill="#FFFFFF"/>
  <circle cx="290" cy="220" r="3" fill="#FFFFFF"/>

  <!-- Nose & Caring Smile -->
  <path d="M254 226 Q261 244 252 250" fill="none" stroke="#C98A63" stroke-width="3" stroke-linecap="round"/>
  <path d="M234 270 Q256 286 278 270" fill="none" stroke="#B85C52" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Front Hair & Small Hair Clip -->
  <path d="M178 214 C178 144, 244 124, 286 136 C322 146, 336 178, 332 218 C320 184, 294 166, 268 164 C242 180, 200 188, 178 214 Z" fill="#232836"/>
  <!-- Small teal-pearl hair clip -->
  <rect x="290" y="168" width="26" height="9" rx="4.5" transform="rotate(18 303 172)" fill="#E0F2F1" stroke="#4A8E9A" stroke-width="2"/>

  <!-- Arms & Colored Pencil Box Held Calmly -->
  <path d="M138 410 C124 446, 134 484, 174 494 L208 494" fill="none" stroke="url(#cardigan10)" stroke-width="42" stroke-linecap="round"/>
  <path d="M374 410 C388 446, 378 484, 338 494 L304 494" fill="none" stroke="url(#cardigan10)" stroke-width="42" stroke-linecap="round"/>

  <!-- Box of colored pencils -->
  <g transform="translate(194, 384)">
    <!-- Colored pencils peeking out -->
    <polygon points="18,22 24,0 30,22" fill="#FDE68A"/><rect x="18" y="22" width="12" height="22" fill="#EF4444"/>
    <polygon points="36,20 42,-2 48,20" fill="#FDE68A"/><rect x="36" y="20" width="12" height="24" fill="#F59E0B"/>
    <polygon points="54,22 60,0 66,22" fill="#FDE68A"/><rect x="54" y="22" width="12" height="22" fill="#10B981"/>
    <polygon points="72,20 78,-2 84,20" fill="#FDE68A"/><rect x="72" y="20" width="12" height="24" fill="#3B82F6"/>
    <polygon points="90,22 96,0 102,22" fill="#FDE68A"/><rect x="90" y="22" width="12" height="22" fill="#8B5CF6"/>
    <!-- Pencil box body -->
    <rect x="8" y="34" width="108" height="84" rx="10" fill="#FFFFFF" stroke="#4A8E9A" stroke-width="4"/>
    <rect x="18" y="48" width="88" height="20" rx="5" fill="#5BA4B0" opacity="0.28"/>
    <circle cx="40" cy="88" r="8" fill="#F59E0B" opacity="0.7"/>
    <circle cx="62" cy="88" r="8" fill="#10B981" opacity="0.7"/>
    <circle cx="84" cy="88" r="8" fill="#3B82F6" opacity="0.7"/>
  </g>

  <!-- Gentle hands holding the box -->
  <ellipse cx="196" cy="466" rx="22" ry="15" fill="#FAC7A2" stroke="#C98A63" stroke-width="3"/>
  <ellipse cx="316" cy="466" rx="22" ry="15" fill="#FAC7A2" stroke="#C98A63" stroke-width="3"/>
</svg>
